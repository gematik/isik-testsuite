tigerProxy: # https://gematik.github.io/app-Tiger/Tiger-User-Manual.html#_configuring_the_local_test_suite_tiger_proxy
  adminPort: 9011

# Activate and adjust the configuration below if the SUT endpoint contains a URL path, e.g. /some/path/to/endpoint
  proxyRoutes:
    - from: "http://fhirserver"
      # Adjust the URL to your SUT endpoint
      to: "http://localhost:8080/fhir"
# Optional authentication (basic or bearer), cf. https://gematik.github.io/app-Tiger/Tiger-User-Manual.html#authentication
#      authentication:
#        username: "pass"
#        password: "word"

# Activate and adjust the configuration below if behind a proxy
#  forwardToProxy:
#    hostname: 192.168.110.10
#    port: 3128
#    type: HTTP
#    noProxyHosts:
#      - "localhost"

lib:
  activateWorkflowUi: true
  workflowUiPort: 9012
  trafficVisualization: true
  runTestsOnStart: true

logging:
  level:
    de.gematik.rbellogger.converter: WARN

additionalConfigurationFiles:
  - filename: testdata/Stufe5/basis.yaml
    baseKey: basis
  - filename: testdata/Stufe5/dokumentenaustausch.yaml
    baseKey: dokument
  - filename: testdata/Stufe5/medikation.yaml
    baseKey: medikation
  - filename: testdata/Stufe5/terminplanung.yaml
    baseKey: terminplanung
  - filename: testdata/Stufe5/vitalparameter.yaml
    baseKey: vitalparameter
  - filename: testdata/Stufe5/connect.yaml
    baseKey: connect
  - filename: testdata/Stufe5/icu-minimal.yaml
    baseKey: icuminimal
  - filename: testdata/Stufe5/icu-extended.yaml
    baseKey: icuextended
  - filename: testdata/Stufe5/labor.yaml
    baseKey: labor
